<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | Manajemen Kampus</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body class="login-page">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-11 col-sm-8 col-md-6 col-lg-4">
        <div class="card shadow-lg border-0 rounded-4">
          <div class="card-body p-4 p-md-5">
            <div class="text-center mb-4">
              <i class="bi bi-mortarboard-fill text-primary" style="font-size: 3rem;"></i>
              <h4 class="fw-bold mt-2 mb-0">SIM Kampus</h4>
              <small class="text-muted">Silakan login untuk melanjutkan</small>
            </div>

            {% with messages = get_flashed_messages(with_categories=true) %}
              {% for kategori, pesan in messages %}
              <div class="alert alert-{{ kategori }} py-2" role="alert">{{ pesan }}</div>
              {% endfor %}
            {% endwith %}

            <form method="post" autocomplete="off">
              <div class="mb-3">
                <label class="form-label" for="username">Username</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-person"></i></span>
                  <input type="text" class="form-control" id="username" name="username" required autofocus>
                </div>
              </div>
              <div class="mb-4">
                <label class="form-label" for="password">Password</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-lock"></i></span>
                  <input type="password" class="form-control" id="password" name="password" required>
                </div>
              </div>
              <button type="submit" class="btn btn-primary w-100 py-2">
                <i class="bi bi-box-arrow-in-right me-1"></i> Login
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
